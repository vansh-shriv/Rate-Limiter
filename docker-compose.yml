services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  app:
    build: .
    environment:
      RL_REDIS_ADDR: redis:6379
    ports: ["8080:8080"]
    depends_on:
      redis:
        condition: service_healthy
