services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  # Demo upstream service: echoes request info. The app proxies to it behind the rate limiter.
  upstream:
    image: traefik/whoami

  app:
    build: .
    environment:
      RL_REDIS_ADDR: redis:6379
      RL_UPSTREAM_URL: http://upstream:80
      RL_SHUTDOWN_DELAY: ${RL_SHUTDOWN_DELAY:-0s}   # set e.g. 5s behind a load balancer to drain before closing
      RL_ADMIN_TOKEN: dev-admin-token   # DEMO ONLY: set a strong secret in real deployments
      # RL_AUTH_MODE defaults to "apikey": clients must present a tenant API key.
      # Fallback rule for the built-in "default" tenant (only reachable with RL_AUTH_MODE=header):
      RL_DEFAULT_LIMIT: "5"
      RL_DEFAULT_WINDOW: 10s
    ports: ["8080:8080"]
    depends_on:
      redis:
        condition: service_healthy
      upstream:
        condition: service_started

  # ---- Observability ----
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [app, redis-exporter]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # DEMO ONLY: read-only anonymous access
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin        # DEMO ONLY
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
